name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  id-token: write

env:
  REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}
  ACR_NAME: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}
  IMAGE_NAME: team8-frontend

jobs:
  build-and-push:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (
        (github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main') ||
        (github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.pull_requests[0].base.ref == 'main')
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Set image tags
        id: tags
        run: |
          echo "image=$REGISTRY/$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "commit_tag=main-${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.commit_tag }}
            ${{ steps.tags.outputs.image }}:latest

  terraform-apply:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_database_admin_password: ${{ secrets.DATABASE_ADMIN_PASSWORD }}
      TF_VAR_container_registry_login_server: ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Resolve Container Registry ID
        run: echo "TF_VAR_container_registry_id=$(az acr show --name ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }} --query id -o tsv)" >> "$GITHUB_ENV"

      - name: Initialize Terraform
        run: terraform -chdir=my_infrastructure init

      - name: Plan Terraform changes
        run: terraform -chdir=my_infrastructure plan -out=tfplan -var="environment=dev"

      - name: Apply Terraform changes
        run: terraform -chdir=my_infrastructure apply -auto-approve tfplan

      - name: Read Terraform outputs
        id: tf-outputs
        run: |
          echo "resource_group=$(terraform -chdir=my_infrastructure output -raw resource_group_name)" >> "$GITHUB_OUTPUT"
          echo "container_app=$(terraform -chdir=my_infrastructure output -raw frontend_container_app_name)" >> "$GITHUB_OUTPUT"

    outputs:
      resource_group: ${{ steps.tf-outputs.outputs.resource_group }}
      container_app: ${{ steps.tf-outputs.outputs.container_app }}

  update-container-app:
    needs: [build-and-push, terraform-apply]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update frontend Container App image
        run: |
          az containerapp update \
            --name "${{ needs.terraform-apply.outputs.container_app }}" \
            --resource-group "${{ needs.terraform-apply.outputs.resource_group }}" \
            --image "${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/team8-frontend:main-${{ github.event.workflow_run.head_sha }}"
            