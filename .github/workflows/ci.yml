name : CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint app
        run: npm run lint

      - name: Build app
        run: npm run build

      - name: Test app
        run: npm test

      - name: Finish message
        run: echo "CI pipeline completed successfully!"
        
