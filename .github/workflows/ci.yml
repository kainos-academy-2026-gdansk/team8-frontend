name : CI

on:
  push:
    branches: [main, master, platforms-01-rafal]
  pull_request:
    branches: [main, master, platforms-01-rafal]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ACR_NAME: acraiacademy26.azurecr.io

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint app
        run: npm run lint

      - name: Build app
        run: npm run build

      - name: Test app
        run: npm test

      - name: Finish message
        run: echo "CI pipeline completed successfully!"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        run: |
          IMAGE_TAG="${GITHUB_SHA::12}"
          docker build -t team8-frontend:${IMAGE_TAG} .

      - name: Log in to Azure Container Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/platforms-01-rafal')
        uses: azure/login@v3
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID_RAFAL }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET_RAFAL }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            }

      - name: Log in to Azure Container Registry Docker registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/platforms-01-rafal')
        run: az acr login --name "$ACR_NAME"

      - name: Push image to Azure Container Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/platforms-01-rafal')
        run: |
          IMAGE_TAG="${GITHUB_SHA::12}"
          ACR_LOGIN_SERVER="$(az acr show --name "$ACR_NAME" --query loginServer --output tsv)"
          IMAGE_NAME="${ACR_LOGIN_SERVER}/team8-frontend"

          docker tag "team8-frontend:${IMAGE_TAG}" "${IMAGE_NAME}:${IMAGE_TAG}"
          docker push "${IMAGE_NAME}:${IMAGE_TAG}"

          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            docker tag "team8-frontend:${IMAGE_TAG}" "${IMAGE_NAME}:latest"
            docker push "${IMAGE_NAME}:latest"
          else
            docker tag "team8-frontend:${IMAGE_TAG}" "${IMAGE_NAME}:platforms-01-rafal"
            docker push "${IMAGE_NAME}:platforms-01-rafal"
          fi
