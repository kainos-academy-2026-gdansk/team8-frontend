name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 20 * * *"  

permissions:
  contents: read
  id-token: write

env:
  REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}
  ACR_NAME: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}
  BACKEND_IMAGE: team8-backend:latest

jobs:
  playwright:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run build
      - run: npm run test:ui:typecheck
      - name: Build frontend image for E2E
        run: docker build --tag team8-frontend:e2e .

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      # Postgres must be reachable before the backend starts, so it's started
      # and waited on separately rather than as a parallel "services:" entry.
      - name: Start backend database
        run: |
          docker network create e2e-net
          docker run -d --name backend-db --network e2e-net \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=team8_backend \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec backend-db pg_isready -U postgres -d team8_backend && break
            sleep 2
          done

      - name: Start backend
        run: |
          docker run -d --name backend --network e2e-net \
            --restart on-failure:5 \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e DATABASE_URL=postgresql://postgres:postgres@backend-db:5432/team8_backend \
            -e JWT_SECRET=ci-jwt-secret \
            -p 3000:3000 \
            "$REGISTRY/$BACKEND_IMAGE"
          # migrate deploy + db seed run before the server starts, so give it more headroom
          for i in $(seq 1 45); do
            curl -fsS http://localhost:3000/ && break
            if [ "$i" = 45 ]; then
              echo "Backend never became ready" >&2
              docker logs backend
              exit 1
            fi
            sleep 2
          done

      - name: Start frontend
        run: |
          docker run -d --name frontend --network host \
            -e NODE_ENV=production \
            -e PORT=3001 \
            -e SESSION_SECRET=ci-secret \
            -e API_BASE_URL=http://localhost:3000/api \
            team8-frontend:e2e
          for i in $(seq 1 45); do
            curl -fsS http://localhost:3001/ && break
            if [ "$i" = 45 ]; then
              echo "Frontend never became ready" >&2
              docker logs frontend
              exit 1
            fi
            sleep 2
          done

      - run: npm run test:ui
        env:
          E2E_BASE_URL: http://localhost:3001

      - name: Dump backend logs on failure
        if: failure()
        run: |
          docker logs backend
          docker logs frontend || true

      - name: Stop backend containers
        if: always()
        run: |
          docker rm -f frontend backend backend-db || true
          docker network rm e2e-net || true

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

