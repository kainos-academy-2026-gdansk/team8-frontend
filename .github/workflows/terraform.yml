name: Terraform

on:
  push:
    branches: [main, master, platforms-01-rafal]
    paths:
      - "my-infrastructure/**"
  pull_request:
    branches: [main, master, platforms-01-rafal]
    paths:
      - "my-infrastructure/**"

defaults:
  run:
    working-directory: my-infrastructure

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      # Service principal credentials: the azurerm provider (and the
      # azurerm backend, via use_azuread_auth) read these automatically.
      # No `az login` or provider credentials block needed.
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_RAFAL }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET_RAFAL }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init (dev backend)
        run: terraform init -input=false -backend-config=environments/dev.backend.hcl

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan (dev)
        run: terraform plan -input=false -var-file=environments/dev.tfvars -out=tfplan

      # Only apply on a push to main. Every other trigger (pull requests,
      # feature branches) stops after the plan above so changes can be
      # reviewed before they touch real infrastructure.
      - name: Terraform apply (dev)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false -auto-approve tfplan
