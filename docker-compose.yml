# Define the services that make up the local application.
services:
  frontend:
    # Build this service using the Dockerfile in the current folder.
    build:
      context: .
      dockerfile: Dockerfile

    # Map the host port 3001 to the container port 3001.
    ports:
      - "3001:3001"

    # Pass configuration into the running container.
    environment:
      NODE_ENV: production
      PORT: 3001
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env or your shell}
      API_BASE_URL: http://host.docker.internal:3000/api
